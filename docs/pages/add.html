<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         BASIC PAGE SETTINGS
         ========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Occasion - Remember a Day</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="../css/style.css">

</head>


<body class="add-occasion-page">


    <!-- ==========================================
     APP HEADER
     ========================================== -->

    <header class="app-header">

        <div class="header-content">

            <div class="app-brand">

                <div class="app-logo">
                    ♥
                </div>

                <div>

                    <h1 id="page-title">
                        Add Occasion
                    </h1>

                    <p class="tagline">
                        Add a day you never want to forget.
                    </p>

                </div>

            </div>

        </div>

    </header>



    <!-- ==========================================
         MAIN CONTENT
         ========================================== -->

    <main class="app-container">


        <!-- ======================================
             OCCASION FORM
             ====================================== -->

        <form id="occasion-form">


            <!-- ==================================
                 NAME
                 ================================== -->

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input type="text" id="name" placeholder="Example: Mom's Birthday" required>

            </div>



            <!-- ==================================
                 OCCASION TYPE
                 ================================== -->

            <div class="form-group">

                <label for="type">
                    Occasion Type
                </label>

                <select id="type" required>

                    <option value="">
                        Select occasion
                    </option>

                    <option value="Birthday">
                        Birthday
                    </option>

                    <option value="Anniversary">
                        Anniversary
                    </option>

                    <option value="Custom Occasion">
                        Custom Occasion
                    </option>

                </select>

            </div>



            <!-- ==================================
                 DATE
                 ================================== -->

            <div class="form-group">

                <label for="date">
                    Date
                </label>

                <input type="date" id="date" required>

            </div>



            <!-- ==================================
                 REMINDER
                 ================================== -->

            <div class="form-group">

                <label for="reminder">
                    Remind me
                </label>

                <select id="reminder">
                    <option value="none">
                        No reminder
                    </option>

                    <option value="0">
                        🔔 On the day
                    </option>

                    <option value="1">
                        1 day before
                    </option>

                    <option value="7">
                        1 week before
                    </option>

                    <option value="30">
                        30 days before
                    </option>
                </select>

            </div>



            <!-- ==================================
                 NOTES
                 ================================== -->

            <div class="form-group">

                <label for="notes">
                    Notes
                </label>

                <textarea id="notes" rows="4" placeholder="Anything you want to remember..."></textarea>

            </div>


            <!-- PHOTO MEMORIES -->
            <div class="form-group">
                <label for="event-photo">Photo Memories</label>

                <input type="file" id="event-photo" accept="image/*" multiple>

                <small class="input-help">
                    Upload up to 5 special photos (JPG, PNG or WebP).
                </small>
            </div>

            <div id="photo-preview" class="photo-preview"></div>

            <!-- VOICE MEMORY -->
            <section class="voice-memory-form">
                <div class="voice-memory-heading">
                    <div>
                        <span class="voice-eyebrow">A VOICE TO REMEMBER</span>
                        <h3>Record a Voice Memory</h3>
                        <p>Save a message, a laugh or a special moment.</p>
                    </div>
                    <span class="voice-heading-icon">🎙️</span>
                </div>

                <div class="voice-controls">
                    <button type="button" id="record-voice" class="voice-record-button">
                        <span>●</span> Start Recording
                    </button>

                    <span id="recording-status">Ready to record</span>
                    <span id="recording-timer">00:00 / 00:30</span>
                </div>

                <div id="voice-preview" class="voice-preview" hidden>
                    <audio id="voice-audio" controls></audio>

                    <button type="button" id="delete-voice" class="voice-delete-button">
                        Remove Recording
                    </button>
                </div>
            </section>




            <!-- ==================================
    GIFT DETAILS
    ================================== -->

            <div class="gift-section">

                <p class="section-label">
                    GIFT
                </p>

                <div class="form-group">

                    <label for="gift-idea">
                        Gift Idea
                    </label>

                    <input type="text" id="gift-idea" placeholder="Example: Watch, Dress, Flowers">

                </div>


                <div class="form-group">

                    <label for="gift-budget">
                        Budget
                    </label>

                    <input type="number" id="gift-budget" placeholder="Example: 2000" min="0">

                </div>


                <div class="form-group">

                    <label for="gift-status">
                        Gift Status
                    </label>

                    <select id="gift-status">

                        <option value="planned">
                            Planned
                        </option>

                        <option value="bought">
                            Bought
                        </option>

                        <option value="given">
                            Given
                        </option>

                    </select>

                </div>

            </div>

            <!-- ==================================
                 SAVE BUTTON
                 ================================== -->

            <button type="submit" class="primary-button save-button" id="save-button">
                Save Occasion
            </button>


        </form>


    </main>



    <!-- ==========================================
         BOTTOM NAVIGATION
         ========================================== -->

    <nav class="bottom-nav">


        <!-- HOME -->

        <a href="../index.html" class="nav-item">

            <span>⌂</span>

            <small>
                Home
            </small>

        </a>



        <!-- ADD -->

        <a href="add.html" class="nav-item active">

            <span>＋</span>

            <small>
                Add
            </small>

        </a>



        <!-- MEMORIES -->

        <a href="memories.html" class="nav-item">

            <span>♥</span>

            <small>
                Memories
            </small>

        </a>

        <a href="../settings.html" class="nav-item">
            <span>⚙</span>
            <small>Settings</small>
        </a>


    </nav>



    <!-- ==========================================
         JAVASCRIPT FILES
         ========================================== -->

    <script src="../js/storage.js"></script>

    <script src="../js/events.js"></script>



    <!-- ==========================================
         ADD / EDIT OCCASION LOGIC
         ========================================== -->

    <script>

        /* ==========================================
           ADD / EDIT OCCASION
           PHOTO GALLERY + VOICE MEMORY
           ========================================== */

        const form = document.getElementById("occasion-form");

        const urlParams = new URLSearchParams(window.location.search);
        const editingId = urlParams.get("edit");

        const photoInput = document.getElementById("event-photo");
        const photoPreview = document.getElementById("photo-preview");

        const recordButton = document.getElementById("record-voice");
        const recordingStatus = document.getElementById("recording-status");
        const recordingTimer = document.getElementById("recording-timer");
        const voicePreview = document.getElementById("voice-preview");
        const voiceAudio = document.getElementById("voice-audio");
        const deleteVoiceButton = document.getElementById("delete-voice");

        const MAX_PHOTOS = 5;
        const MAX_RECORDING_SECONDS = 30;

        let selectedPhotos = [];
        let voiceData = "";
        let voiceMimeType = "";
        let mediaRecorder = null;
        let audioChunks = [];
        let recordingInterval = null;
        let recordingSeconds = 0;
        let stream = null;
        let existingEvent = null;


        /* ==========================================
           HELPERS
           ========================================== */

        function fileToDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);

                reader.readAsDataURL(file);
            });
        }

        function compressPhoto(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onerror = () => reject(reader.error);

                reader.onload = () => {
                    const image = new Image();

                    image.onerror = reject;

                    image.onload = () => {
                        const canvas = document.createElement("canvas");

                        const maxSize = 700;
                        const scale = Math.min(
                            1,
                            maxSize / Math.max(image.width, image.height)
                        );

                        canvas.width = Math.round(image.width * scale);
                        canvas.height = Math.round(image.height * scale);

                        const context = canvas.getContext("2d");

                        context.drawImage(
                            image,
                            0,
                            0,
                            canvas.width,
                            canvas.height
                        );

                        resolve(canvas.toDataURL("image/jpeg", 0.68));
                    };

                    image.src = reader.result;
                };

                reader.readAsDataURL(file);
            });
        }

        function formatRecordingTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remaining = seconds % 60;

            return `${String(minutes).padStart(2, "0")}:${String(remaining).padStart(2, "0")}`;
        }


        /* ==========================================
           LOAD EXISTING EVENT
           ========================================== */

        if (editingId) {
            const events = getEvents();

            existingEvent = events.find(
                event => String(event.id) === String(editingId)
            );

            if (existingEvent) {
                document.getElementById("page-title").textContent = "Edit Occasion";
                document.getElementById("save-button").textContent = "Update Occasion";

                document.getElementById("name").value =
                    existingEvent.name || "";

                document.getElementById("type").value =
                    ["Other", "Custom", "Custom Occasion"].includes(existingEvent.type)
                        ? "Custom Occasion"
                        : existingEvent.type;

                document.getElementById("date").value =
                    existingEvent.date || "";

                document.getElementById("reminder").value =
                    existingEvent.reminder || "none";

                document.getElementById("notes").value =
                    existingEvent.notes || "";

                document.getElementById("gift-idea").value =
                    existingEvent.gift?.idea || "";

                document.getElementById("gift-budget").value =
                    existingEvent.gift?.budget || "";

                document.getElementById("gift-status").value =
                    existingEvent.gift?.status || "planned";

                // Support both new gallery data and old single-photo events.
                selectedPhotos = Array.isArray(existingEvent.photos)
                    ? [...existingEvent.photos]
                    : existingEvent.photo
                        ? [existingEvent.photo]
                        : [];

                renderPhotoPreviews();

                if (existingEvent.voiceNote?.data) {
                    voiceData = existingEvent.voiceNote.data;
                    voiceMimeType = existingEvent.voiceNote.mimeType || "audio/webm";

                    showVoicePreview();
                    recordingStatus.textContent = "Saved recording";
                }
            }
        }


        /* ==========================================
           PHOTO UPLOAD
           ========================================== */

        photoInput.addEventListener("change", async function () {
            const files = Array.from(this.files || []);

            if (!files.length) return;

            const availableSlots = MAX_PHOTOS - selectedPhotos.length;

            if (availableSlots <= 0) {
                alert("You can add a maximum of 5 photos.");
                this.value = "";
                return;
            }

            if (files.length > availableSlots) {
                alert(`You can add only ${availableSlots} more photo(s).`);
            }

            const acceptedFiles = files.slice(0, availableSlots);

            for (const file of acceptedFiles) {
                if (!file.type.startsWith("image/")) {
                    alert(`${file.name} is not an image.`);
                    continue;
                }

                try {
                    const compressed = await compressPhoto(file);
                    selectedPhotos.push(compressed);
                    renderPhotoPreviews();
                } catch (error) {
                    console.error("Photo processing failed:", error);
                    alert("One of the photos could not be processed.");
                }
            }

            this.value = "";
        });


        /* ==========================================
           RENDER PHOTO PREVIEWS
           ========================================== */

        function renderPhotoPreviews() {
            photoPreview.innerHTML = selectedPhotos.map((photo, index) => `
        <div class="memory-photo-item">
            <img src="${photo}" alt="Memory photo ${index + 1}">

            <button
                type="button"
                class="remove-memory-photo"
                data-index="${index}"
                aria-label="Remove photo ${index + 1}"
            >×</button>
        </div>
    `).join("");

            photoPreview.classList.toggle(
                "has-photos",
                selectedPhotos.length > 0
            );
        }

        photoPreview.addEventListener("click", function (event) {
            const button = event.target.closest(".remove-memory-photo");

            if (!button) return;

            const index = Number(button.dataset.index);

            selectedPhotos.splice(index, 1);
            renderPhotoPreviews();
        });


        /* ==========================================
           VOICE RECORDING
           ========================================== */

        recordButton.addEventListener("click", async function () {

            if (mediaRecorder && mediaRecorder.state === "recording") {
                stopRecording();
                return;
            }

            if (!navigator.mediaDevices?.getUserMedia ||
                typeof MediaRecorder === "undefined") {
                alert("Voice recording is not supported in this browser.");
                return;
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

                audioChunks = [];
                recordingSeconds = 0;

                const supportedTypes = [
                    "audio/webm;codecs=opus",
                    "audio/webm",
                    "audio/mp4"
                ];

                const mimeType = supportedTypes.find(type =>
                    MediaRecorder.isTypeSupported(type)
                );

                mediaRecorder = mimeType
                    ? new MediaRecorder(stream, { mimeType })
                    : new MediaRecorder(stream);

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, {
                        type: mediaRecorder.mimeType || "audio/webm"
                    });

                    voiceMimeType = blob.type;
                    voiceData = await fileToDataURL(blob);

                    showVoicePreview();

                    recordingStatus.textContent = "Recording saved";
                    recordButton.innerHTML = "<span>●</span> Record Again";

                    stream?.getTracks().forEach(track => track.stop());
                    stream = null;
                };

                mediaRecorder.start();

                recordingStatus.textContent = "Recording...";
                recordButton.innerHTML = "<span>■</span> Stop Recording";

                recordingTimer.textContent = "00:00 / 00:30";

                recordingInterval = setInterval(() => {
                    recordingSeconds++;

                    recordingTimer.textContent =
                        `${formatRecordingTime(recordingSeconds)} / 00:30`;

                    if (recordingSeconds >= MAX_RECORDING_SECONDS) {
                        stopRecording();
                    }
                }, 1000);

            } catch (error) {
                console.error("Microphone error:", error);
                alert("Please allow microphone access to record a voice memory.");
            }
        });


        function stopRecording() {
            clearInterval(recordingInterval);

            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            }
        }


        function showVoicePreview() {
            voicePreview.hidden = false;
            voiceAudio.src = voiceData;

            recordButton.innerHTML = "<span>●</span> Record Again";
        }


        deleteVoiceButton.addEventListener("click", function () {
            voiceData = "";
            voiceMimeType = "";

            voiceAudio.pause();
            voiceAudio.removeAttribute("src");
            voiceAudio.load();

            voicePreview.hidden = true;

            recordingStatus.textContent = "Ready to record";
            recordingTimer.textContent = "00:00 / 00:30";

            recordButton.innerHTML = "<span>●</span> Start Recording";
        });


        /* ==========================================
           SAVE / UPDATE OCCASION
           ========================================== */

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            if (mediaRecorder && mediaRecorder.state === "recording") {
                alert("Please stop your voice recording before saving.");
                return;
            }

            const oldPhoto = selectedPhotos[0] || "";

            const occasion = {
                name: document.getElementById("name").value.trim(),

                type: document.getElementById("type").value,

                category:
                    document.getElementById("type").value === "Birthday"
                        ? "birthday"
                        : document.getElementById("type").value === "Anniversary"
                            ? "anniversary"
                            : "custom",

                date: document.getElementById("date").value,

                reminder: document.getElementById("reminder").value,

                notes: document.getElementById("notes").value.trim(),

                // Keep the old field for existing home cards.
                photo: oldPhoto,

                // New gallery field.
                photos: selectedPhotos,

                // New voice-note field.
                voiceNote: voiceData
                    ? {
                        data: voiceData,
                        mimeType: voiceMimeType,
                        duration: recordingSeconds
                    }
                    : null,

                gift: {
                    idea: document.getElementById("gift-idea").value.trim(),
                    budget: document.getElementById("gift-budget").value,
                    status: document.getElementById("gift-status").value
                }
            };

            try {
                if (editingId) {
                    const events = getEvents();

                    const index = events.findIndex(
                        item => String(item.id) === String(editingId)
                    );

                    if (index === -1) {
                        alert("Could not find this occasion.");
                        return;
                    }

                    occasion.id = Number(editingId);

                    events[index] = occasion;
                    saveEvents(events);

                    alert("Occasion updated successfully! ✨");

                } else {
                    addEvent(occasion);

                    alert("Occasion saved successfully! 🎉");
                }

                window.location.href = "../index.html";

            } catch (error) {
                console.error("Could not save occasion:", error);

                alert(
                    "Could not save this occasion. Your browser storage may be full. " +
                    "Try using fewer photos or a shorter voice recording."
                );
            }
        });


        /* ==========================================
           CLEAN UP MICROPHONE
           ========================================== */

        window.addEventListener("beforeunload", () => {
            clearInterval(recordingInterval);

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });

    </script>


</body>

</html>
